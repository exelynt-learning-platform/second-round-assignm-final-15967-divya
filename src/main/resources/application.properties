spring.application.name=MultigenesisProjectECommerce

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

server.port=${SERVER_PORT:8181}

logging.level.org.springframework.security=${LOG_LEVEL:INFO}
logging.level.org.springframework.cache=${LOG_LEVEL:INFO}
logging.level.root=${LOG_LEVEL:INFO}

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

spring.cache.caffeine.spec=maximumSize=500,
expireAfterWrite=10m
#
stripe.secret.key=${STRIPE_SECRET_KEY}

app.frontend.success-url=${FRONTEND_SUCCESS_URL}
app.frontend.cancel-url=${FRONTEND_CANCEL_URL}

spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

cart.max.quantity=${CART_MAX_QUANTITY:10}
cart.min.quantity=${CART_MIN_QUANTITY:1}
pagination.default.page=${PAGINATION_DEFAULT_PAGE:0}
pagination.default.size=${PAGINATION_DEFAULT_SIZE:10}
payment.currency=${PAYMENT_CURRENCY:inr}
address.min.length=${ADDRESS_MIN_LENGTH:10}
address.max.length=${ADDRESS_MAX_LENGTH:15}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
jwt.secret.min-bytes=${JWT_MIN_BYTES:32}
jwt.secret.max-bytes=${JWT_MAX_BYTES:64}
jwt.secret.min-entropy-threshold=${JWT_MIN_ENTROPY:0.5}
jwt.secret.key-size=${JWT_KEY_SIZE:256}
