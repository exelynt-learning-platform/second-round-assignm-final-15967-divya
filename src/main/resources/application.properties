spring.application.name=MultigenesisProjectECommerce

# Database (safe defaults for local dev, override via env in prod)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

server.port=${SERVER_PORT:8181}

# Logging
logging.level.org.springframework.security=${LOG_LEVEL:INFO}
logging.level.org.springframework.cache=${LOG_LEVEL:INFO}
logging.level.root=${LOG_LEVEL:INFO}

# JWT (⚠️ REQUIRED - no default allowed for security)
# Must be provided via environment variable in all environments
jwt.secret=${JWT_SECRET}

# JWT expiration time (1 hour)
jwt.expiration=3600000

# Cache
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# Stripe (⚠️ REQUIRED - no fallback or default key)
# Never hardcode API keys in source code
stripe.secret.key=${STRIPE_SECRET_KEY}

# Frontend URLs
app.frontend.success-url=${FRONTEND_SUCCESS_URL:http://localhost:3000/payment-success/}
app.frontend.cancel-url=${FRONTEND_CANCEL_URL:http://localhost:3000/payment-failed/}

# Redis
spring.redis.host=localhost
spring.redis.port=6379